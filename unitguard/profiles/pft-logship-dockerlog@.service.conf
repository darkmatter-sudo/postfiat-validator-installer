#@ class: docker
#@ exception: follows `docker logs -f` over /var/run/docker.sock (root-equivalent via the docker API); runs as root (the socket is root:docker 0660) with no capabilities, AF_UNIX only, ProtectSystem=strict + ReadWritePaths only for its resume state
#@ check: u=$(systemctl list-units --all --plain --no-legend 'pft-logship-dockerlog@*.service' | awk '{print $1}' | head -1); c=${u#pft-logship-dockerlog@}; c=${c%.service}; i=$(systemctl show -p InvocationID --value "$u"); for _ in $(seq 45); do n=$(journalctl -q -o cat -n 1 _SYSTEMD_INVOCATION_ID="$i" SYSLOG_IDENTIFIER="$c" | wc -l); [ "$n" -gt 0 ] && { echo "journal has lines from invocation $i"; exit 0; }; sleep 2; done; echo "no journal line from invocation $i after 90 s"; exit 1
#@ note: long-running (Restart=always). The check waits for journal lines from the NEW invocation, because a resume with `docker logs --since` first scans every rotated json-file log (~19 s on the validator, logs/logship/since-scan.log); lines are delayed by the restart, not lost (resume state). The container name is the raw %i instance string
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RemoveIPC=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@resources @mount @swap @reboot @module @raw-io @clock @cpu-emulation @debug @obsolete @privileged
SystemCallErrorNumber=EPERM
AmbientCapabilities=
CapabilityBoundingSet=
RestrictAddressFamilies=AF_UNIX
UMask=0077
ReadWritePaths=/var/lib/pft-logship/dockerlog
