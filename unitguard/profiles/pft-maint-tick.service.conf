#@ class: standard
#@ check: test "$(systemctl show -p Result --value pft-maint-tick.service)" = success && test "$(systemctl show -p ExecMainStatus --value pft-maint-tick.service)" = 0
#@ note: tick only reads/archives the window flag in /var/lib/pft-maint and sends one ntfy message at expiry (curl over AF_INET/AF_INET6); it needs no docker socket, so the draft docker class was too wide
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
ProcSubset=pid
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RemoveIPC=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
SystemCallErrorNumber=EPERM
CapabilityBoundingSet=
AmbientCapabilities=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
ReadWritePaths=/var/lib/pft-maint
