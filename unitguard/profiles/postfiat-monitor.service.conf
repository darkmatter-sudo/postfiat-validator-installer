#@ class: iptables
#@ exception: runs postfiat-health, which reads netfilter rules (ufw status, iptables -S DOCKER-USER: CAP_NET_ADMIN, AF_NETLINK, host network namespace) and inspects/execs the node container over /var/run/docker.sock (root-equivalent); runs as root
#@ check: test "$(systemctl show -p Result --value postfiat-monitor.service)" = success && tail -n 1 /var/log/postfiat-monitor.log | grep -q '] OK: '
#@ note: the standard profile (empty CapabilityBoundingSet) would make postfiat-health fail its UFW/DOCKER-USER checks and report a healthy node as down
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RemoveIPC=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@resources @mount @swap @reboot @module @raw-io @clock @cpu-emulation @debug @obsolete
SystemCallErrorNumber=EPERM
AmbientCapabilities=
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
UMask=0077
ReadWritePaths=/var/lib/postfiat-monitor /var/log/postfiat-monitor.log /run
