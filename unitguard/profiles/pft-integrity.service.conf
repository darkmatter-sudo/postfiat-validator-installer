#@ class: iptables
#@ exception: reads netfilter rules (iptables/ip6tables -S DOCKER-USER, ufw show added: CAP_NET_ADMIN/CAP_NET_RAW, AF_NETLINK, host network namespace, /run for the xtables/ufw locks), inspects the node container over /var/run/docker.sock (root-equivalent) and reads root-only config files and the container's config volume (CAP_DAC_READ_SEARCH); runs as root
#@ check: test "$(systemctl show -p Result --value pft-integrity.service)" = success && test "$(systemctl show -p ExecMainStatus --value pft-integrity.service)" = 0
#@ note: ExecMainStatus 0 = RESULT PASS (the unit treats 1/2 = WARN/FAIL as success, so Result alone would hide a sandbox-caused false WARN); /var/lib/pft-maint is writable because `pft-maint active` takes its lock there - without it a WARN inside a maintenance window would be sent instead of suppressed
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RemoveIPC=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@resources @mount @swap @reboot @module @raw-io @clock @cpu-emulation @debug @obsolete
SystemCallErrorNumber=EPERM
AmbientCapabilities=
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW CAP_DAC_READ_SEARCH
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
UMask=0077
ReadWritePaths=/var/lib/pft-integrity /var/lib/pft-maint /run
