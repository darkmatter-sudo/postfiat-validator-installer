#@ class: docker
#@ exception: talks to /var/run/docker.sock (root-equivalent via the docker API) and reaches the sentry over ssh as SSH_RUNAS (runuser needs CAP_SETUID/CAP_SETGID, ssh needs AF_INET and a read-only view of /home for the key)
#@ note: runuser runs the PAM session stack; pam_limits (required) sets nofile/memlock/priority, so this profile keeps the @resources syscalls and CAP_SYS_RESOURCE/CAP_SYS_NICE (probe run 1: "runuser: cannot open session: Permission denied")
#@ check: f=/var/lib/pft-exporter/textfile/pft_divergence.prom; [ $(( $(date +%s) - $(stat -c %Y $f) )) -lt 300 ] && grep -qx "pft_divergence_overall_state 0" $f
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RemoveIPC=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@mount @swap @reboot @module @raw-io @clock @cpu-emulation @debug @obsolete
SystemCallErrorNumber=EPERM
AmbientCapabilities=
ProtectHome=read-only
CapabilityBoundingSet=CAP_SETUID CAP_SETGID CAP_AUDIT_WRITE CAP_SYS_RESOURCE CAP_SYS_NICE
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
ReadWritePaths=/var/lib/pft-exporter/textfile /var/lib/pft-divergence
