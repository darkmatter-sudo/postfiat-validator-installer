#@ class: docker
#@ exception: talks to /var/run/docker.sock (root-equivalent via the docker API); runs as root with AF_UNIX, ProtectSystem=strict + ReadWritePaths only for its own output
#@ check: f=/var/lib/pft-exporter/textfile/pft_logship.prom; [ $(( $(date +%s) - $(stat -c %Y $f) )) -lt 120 ] && grep -qx "pft_logship_up 1" $f
#@ note: needs CAP_DAC_READ_SEARCH to read the 0640 systemd-journal-remote journals; AF_INET/AF_INET6 for the journal-upload status check
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RemoveIPC=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@resources @mount @swap @reboot @module @raw-io @clock @cpu-emulation @debug @obsolete
SystemCallErrorNumber=EPERM
AmbientCapabilities=
ProtectHome=yes
CapabilityBoundingSet=CAP_DAC_READ_SEARCH
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
ReadWritePaths=/var/lib/pft-exporter/textfile /var/lib/pft-logship
