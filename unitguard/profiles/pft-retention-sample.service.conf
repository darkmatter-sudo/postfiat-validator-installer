#@ class: docker
#@ exception: talks to /var/run/docker.sock (root-equivalent via the docker API); runs as root with AF_UNIX, ProtectSystem=strict + ReadWritePaths only for its own output
#@ check: t="$(tail -1 /var/lib/pft-retention/samples.csv | cut -d, -f1)"; [ $(( $(date +%s) - t )) -lt 120 ]
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RemoveIPC=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@resources @mount @swap @reboot @module @raw-io @clock @cpu-emulation @debug @obsolete
SystemCallErrorNumber=EPERM
AmbientCapabilities=
ProtectHome=yes
CapabilityBoundingSet=
RestrictAddressFamilies=AF_UNIX
ReadWritePaths=/var/lib/pft-retention
