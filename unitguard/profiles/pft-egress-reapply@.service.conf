#@ class: iptables
#@ exception: edits netfilter rules (iptables-restore --noflush of its own chain, iptables -C/-D/-I on DOCKER-USER): CAP_NET_ADMIN/CAP_NET_RAW, AF_NETLINK, the host network namespace and /run for the xtables lock; reads the container's IP over /var/run/docker.sock (root-equivalent); runs as root
#@ check: u=$(systemctl list-units --all --plain --no-legend 'pft-egress-reapply@*.service' | awk '{print $1}' | head -1); c=${u#pft-egress-reapply@}; c=${c%.service}; test "$(systemctl show -p Result --value "$u")" = success && pft-egress check --container "$c" >/dev/null
#@ note: the container name is the raw %i instance string (not systemd-unescaped: postfiatd-sentry stays postfiatd-sentry). The timer runs it every 5 min and it exits 0 without touching anything when the chain, the jump and the container IP match the saved state; the reload path (drift) is proven by the forced-drift probe in drill/. No AF_INET/AF_INET6: it only talks to dockerd over AF_UNIX and to netfilter over AF_NETLINK. UMask=0077 does not change its state file mode: pft-egress sets umask 022 itself (probe log)
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RemoveIPC=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@resources @mount @swap @reboot @module @raw-io @clock @cpu-emulation @debug @obsolete
SystemCallErrorNumber=EPERM
AmbientCapabilities=
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW
RestrictAddressFamilies=AF_UNIX AF_NETLINK
UMask=0077
ReadWritePaths=/var/lib/pft-egress /run
