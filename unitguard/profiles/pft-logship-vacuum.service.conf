#@ class: standard
#@ check: journalctl --directory=/var/log/journal/remote --disk-usage
#@ note: runs as the journal files' owner (systemd-journal-remote, 0640 files in a 0755 dir it owns): root with an empty CapabilityBoundingSet cannot read them (probe run 1)
[Service]
User=systemd-journal-remote
Group=systemd-journal-remote
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
ProcSubset=pid
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RemoveIPC=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
SystemCallErrorNumber=EPERM
CapabilityBoundingSet=
AmbientCapabilities=
UMask=0077
PrivateNetwork=yes
RestrictAddressFamilies=AF_UNIX
ReadWritePaths=/var/log/journal/remote
