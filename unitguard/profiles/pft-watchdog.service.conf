#@ class: standard
#@ check: test "$(systemctl show -p ExecMainStatus --value pft-watchdog.service)" = 0 && pft-watchdog status | jq -e '.state == "OK"' >/dev/null && ! find /var/lib/pft-watchdog-spool -maxdepth 1 -name '*.msg' -mmin +2 | grep -q .
#@ note: the spool is owned by the heartbeat user (pftwd, 0700), so root needs CAP_DAC_OVERRIDE to read and remove messages; without it no heartbeat is consumed and the node pages STALE a few minutes later. The check therefore requires that no message older than 2 minutes is left in the spool. /var/lib/pft-maint is writable for `pft-maint apply-remote`/`active` (sentry copy of a validator maintenance window)
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
ProcSubset=pid
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RemoveIPC=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
SystemCallErrorNumber=EPERM
CapabilityBoundingSet=CAP_DAC_OVERRIDE
AmbientCapabilities=
UMask=0077
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
ReadWritePaths=/var/lib/pft-watchdog /var/lib/pft-watchdog-spool /var/lib/pft-maint
ReadOnlyPaths=/etc/pft-watchdog
