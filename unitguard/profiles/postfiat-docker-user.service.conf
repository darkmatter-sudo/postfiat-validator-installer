#@ class: iptables
#@ exception: edits netfilter rules (iptables -N/-F/-I on DOCKER-USER, nf_tables backend): CAP_NET_ADMIN/CAP_NET_RAW, AF_NETLINK, the host network namespace and /run for the xtables lock; runs as root
#@ check: test "$(systemctl show -p Result --value postfiat-docker-user)" = success && iptables -C DOCKER-USER -p tcp --dport 2559 -m state --state ESTABLISHED,RELATED -j ACCEPT >/dev/null && iptables -C DOCKER-USER -p tcp --dport 2559 -m connlimit --connlimit-above 50 -j DROP >/dev/null && iptables -C DOCKER-USER -p tcp --dport 2559 -m state --state NEW -m limit --limit 100/second --limit-burst 50 -j ACCEPT >/dev/null && iptables -C DOCKER-USER -p tcp --dport 2559 -m state --state NEW -j DROP >/dev/null && iptables -C DOCKER-USER -j RETURN >/dev/null && for u in $(systemctl list-units --all --plain --no-legend 'pft-egress-reapply@*.service' | awk '{print $1}'); do c=${u#pft-egress-reapply@}; c=${c%.service}; systemctl restart "$u" && pft-egress check --container "$c" >/dev/null || exit 1; done
#@ note: the script flushes DOCKER-USER, so it also drops pft-egress's jump; the check restarts every pft-egress-reapply@ instance right away (instead of waiting up to 5 min for its timer) and runs pft-egress check. ProtectKernelModules=yes does not stop rules that need a match module that is not loaded yet (boot): the kernel loads it itself through request_module, proven by the xt_time probe in drill/. No AF_INET/AF_INET6: iptables-nft talks to the kernel only over AF_NETLINK.
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RemoveIPC=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@resources @mount @swap @reboot @module @raw-io @clock @cpu-emulation @debug @obsolete
SystemCallErrorNumber=EPERM
AmbientCapabilities=
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW
RestrictAddressFamilies=AF_UNIX AF_NETLINK
UMask=0077
ReadWritePaths=/run
