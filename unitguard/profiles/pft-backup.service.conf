#@ class: docker
#@ exception: talks to /var/run/docker.sock (root-equivalent via the docker API); runs as root with AF_UNIX, ProtectSystem=strict + ReadWritePaths only for its own output; reads the firewall for the archive's firewall/ reference copy (`ufw status verbose`, `iptables -S DOCKER-USER`): CAP_NET_ADMIN/CAP_NET_RAW + AF_NETLINK, host network namespace
#@ check: cd /var/backups/postfiat && f="$(ls -t pft-backup-*.tar.gz | head -1)" && [ $(( $(date +%s) - $(stat -c %Y "$f") )) -lt 600 ] && sha256sum -c "$f.sha256" && l="$(tar -tzf "$f")" && grep -q "/firewall/docker-user.rules$" <<<"$l" && u="$(tar -xzOf "$f" --wildcards "*/firewall/ufw-status.txt")" && ! grep -q "^ERROR" <<<"$u"
#@ note: until 2026-11-08 the profile had AF_UNIX only and no CAP_NET_ADMIN, so every timer-made archive held `ufw-status.txt` = "ERROR: Couldn't determine iptables version" and no `docker-user.rules` (pft-backup keeps going when the firewall commands fail); found by ../backupwatch (content WARN, log 01). /run stays read-only: both commands work without it (probe, backupwatch log 03). The check now requires both firewall members in the newest archive.
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RemoveIPC=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@resources @mount @swap @reboot @module @raw-io @clock @cpu-emulation @debug @obsolete
SystemCallErrorNumber=EPERM
AmbientCapabilities=
ProtectHome=yes
UMask=0077
CapabilityBoundingSet=CAP_DAC_READ_SEARCH CAP_DAC_OVERRIDE CAP_FOWNER CAP_CHOWN CAP_NET_ADMIN CAP_NET_RAW
RestrictAddressFamilies=AF_UNIX AF_NETLINK
ReadWritePaths=/var/backups/postfiat
