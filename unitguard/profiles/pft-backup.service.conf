#@ class: docker
#@ exception: talks to /var/run/docker.sock (root-equivalent via the docker API); runs as root with AF_UNIX, ProtectSystem=strict + ReadWritePaths only for its own output
#@ check: cd /var/backups/postfiat && f="$(ls -t pft-backup-*.tar.gz | head -1)" && [ $(( $(date +%s) - $(stat -c %Y "$f") )) -lt 600 ] && sha256sum -c "$f.sha256" && tar -tzf "$f" >/dev/null
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RemoveIPC=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@resources @mount @swap @reboot @module @raw-io @clock @cpu-emulation @debug @obsolete
SystemCallErrorNumber=EPERM
AmbientCapabilities=
ProtectHome=yes
UMask=0077
CapabilityBoundingSet=CAP_DAC_READ_SEARCH CAP_DAC_OVERRIDE CAP_FOWNER CAP_CHOWN
RestrictAddressFamilies=AF_UNIX
ReadWritePaths=/var/backups/postfiat
