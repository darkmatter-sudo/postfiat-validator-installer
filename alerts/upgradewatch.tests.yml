# promtool unit tests for upgradewatch.rules.yml, generated by ../upgradewatch/tests/gen_promtool_tests.py
# Run: promtool test rules upgradewatch.tests.yml
rule_files:
- upgradewatch.rules.yml
evaluation_interval: 1m
tests:
- name: healthy node for 2h (live values) fires nothing
  input_series:
  - series: pft_upgradewatch_up{job="postfiat", instance="node:9877", container="postfiatd"}
    values: 1x120
  - series: pft_upgradewatch_collect_timestamp_seconds{job="postfiat", instance="node:9877", container="postfiatd"}
    values: 0+60x120
  - series: pft_upgradewatch_amendment_blocked{job="postfiat", instance="node:9877", container="postfiatd"}
    values: '0x120'
  - series: pft_upgradewatch_unsupported_majority_warning{job="postfiat", instance="node:9877", container="postfiatd"}
    values: '0x120'
  - series: pft_upgradewatch_majority_amendments{job="postfiat", instance="node:9877", container="postfiatd", supported="no"}
    values: '0x120'
  - series: pft_upgradewatch_majority_amendments{job="postfiat", instance="node:9877", container="postfiatd", supported="yes"}
    values: '0x120'
  - series: pft_upgradewatch_unsupported_activation_eta_seconds{job="postfiat", instance="node:9877", container="postfiatd"}
    values: '0x120'
  - series: pft_upgradewatch_behind_foundation{job="postfiat", instance="node:9877", container="postfiatd"}
    values: '0x120'
  - series: pft_upgradewatch_peers_newer_ratio{job="postfiat", instance="node:9877", container="postfiatd"}
    values: '0x120'
  - series: pft_upgradewatch_peers_versioned{job="postfiat", instance="node:9877", container="postfiatd"}
    values: 19x120
  alert_rule_test:
  - eval_time: 30m
    alertname: PFTAmendmentBlocked
    exp_alerts: []
  - eval_time: 30m
    alertname: PFTUnsupportedAmendmentMajority
    exp_alerts: []
  - eval_time: 30m
    alertname: PFTUnsupportedAmendmentActivationSoon
    exp_alerts: []
  - eval_time: 30m
    alertname: PFTNodeVersionLag
    exp_alerts: []
  - eval_time: 30m
    alertname: PFTUpgradewatchStale
    exp_alerts: []
  - eval_time: 120m
    alertname: PFTAmendmentBlocked
    exp_alerts: []
  - eval_time: 120m
    alertname: PFTUnsupportedAmendmentMajority
    exp_alerts: []
  - eval_time: 120m
    alertname: PFTUnsupportedAmendmentActivationSoon
    exp_alerts: []
  - eval_time: 120m
    alertname: PFTNodeVersionLag
    exp_alerts: []
  - eval_time: 120m
    alertname: PFTUpgradewatchStale
    exp_alerts: []
  interval: 1m
- name: 'PFTAmendmentBlocked: pending at 11m, fires at 12m (for 2m), resolves when the flag clears'
  input_series:
  - series: pft_upgradewatch_amendment_blocked{job="postfiat", instance="node:9877", container="postfiatd"}
    values: 0x9 1x20 0x19
  alert_rule_test:
  - eval_time: 9m
    alertname: PFTAmendmentBlocked
    exp_alerts: []
  - eval_time: 11m
    alertname: PFTAmendmentBlocked
    exp_alerts: []
  - eval_time: 12m
    alertname: PFTAmendmentBlocked
    exp_alerts:
    - exp_labels:
        job: postfiat
        instance: node:9877
        container: postfiatd
        severity: critical
      exp_annotations:
        summary: postfiatd is AMENDMENT BLOCKED
        description: 'server_info reports amendment_blocked (warning 1002): the network enabled an amendment this build does
          not support, so the node can no longer follow the validated ledger and stops serving current data. Upgrade postfiatd
          now (../upgrade); the node will not recover on its own.'
        runbook_url: https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/upgradewatch/README.md#alerts
  - eval_time: 30m
    alertname: PFTAmendmentBlocked
    exp_alerts:
    - exp_labels:
        job: postfiat
        instance: node:9877
        container: postfiatd
        severity: critical
      exp_annotations:
        summary: postfiatd is AMENDMENT BLOCKED
        description: 'server_info reports amendment_blocked (warning 1002): the network enabled an amendment this build does
          not support, so the node can no longer follow the validated ledger and stops serving current data. Upgrade postfiatd
          now (../upgrade); the node will not recover on its own.'
        runbook_url: https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/upgradewatch/README.md#alerts
  - eval_time: 31m
    alertname: PFTAmendmentBlocked
    exp_alerts: []
  interval: 1m
- name: 'PFTUnsupportedAmendmentMajority: ledger count path fires at 20m, resolves at 41m; supported majority and a 9-minute
    majority blip never fire; the node-warning path (from 15m) fires on its own at 25m'
  input_series:
  - series: pft_upgradewatch_majority_amendments{job="postfiat", instance="node:9877", container="postfiatd", supported="no"}
    values: 0x9 1x30 0x19
  - series: pft_upgradewatch_unsupported_majority_warning{job="postfiat", instance="node:9877", container="postfiatd"}
    values: '0x60'
  - series: pft_upgradewatch_majority_amendments{job="postfiat", instance="node:9877", container="postfiatd-sentry", supported="no"}
    values: '0x60'
  - series: pft_upgradewatch_unsupported_majority_warning{job="postfiat", instance="node:9877", container="postfiatd-sentry"}
    values: 0x14 1x45
  - series: pft_upgradewatch_majority_amendments{job="postfiat", instance="node:9877", container="drill-yes", supported="yes"}
    values: 3x60
  - series: pft_upgradewatch_majority_amendments{job="postfiat", instance="node:9877", container="drill-yes", supported="no"}
    values: '0x60'
  - series: pft_upgradewatch_majority_amendments{job="postfiat", instance="node:9877", container="drill-blip", supported="no"}
    values: 0x9 1x8 0x40
  alert_rule_test:
  - eval_time: 19m
    alertname: PFTUnsupportedAmendmentMajority
    exp_alerts: []
  - eval_time: 20m
    alertname: PFTUnsupportedAmendmentMajority
    exp_alerts:
    - exp_labels:
        job: postfiat
        instance: node:9877
        container: postfiatd
        severity: warning
      exp_annotations:
        summary: 'postfiatd: an amendment this build does not support holds a majority'
        description: At least one amendment that postfiatd on this node does not support has held a majority of trusted validators
          for 10 min. If the majority holds for the network's [amendment_majority_time], it activates and this node becomes
          amendment blocked. Plan the upgrade; pft_upgradewatch_unsupported_activation_eta_seconds is the earliest activation
          time.
        runbook_url: https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/upgradewatch/README.md#alerts
  - eval_time: 24m
    alertname: PFTUnsupportedAmendmentMajority
    exp_alerts:
    - exp_labels:
        job: postfiat
        instance: node:9877
        container: postfiatd
        severity: warning
      exp_annotations:
        summary: 'postfiatd: an amendment this build does not support holds a majority'
        description: At least one amendment that postfiatd on this node does not support has held a majority of trusted validators
          for 10 min. If the majority holds for the network's [amendment_majority_time], it activates and this node becomes
          amendment blocked. Plan the upgrade; pft_upgradewatch_unsupported_activation_eta_seconds is the earliest activation
          time.
        runbook_url: https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/upgradewatch/README.md#alerts
  - eval_time: 25m
    alertname: PFTUnsupportedAmendmentMajority
    exp_alerts:
    - exp_labels:
        job: postfiat
        instance: node:9877
        container: postfiatd
        severity: warning
      exp_annotations:
        summary: 'postfiatd: an amendment this build does not support holds a majority'
        description: At least one amendment that postfiatd on this node does not support has held a majority of trusted validators
          for 10 min. If the majority holds for the network's [amendment_majority_time], it activates and this node becomes
          amendment blocked. Plan the upgrade; pft_upgradewatch_unsupported_activation_eta_seconds is the earliest activation
          time.
        runbook_url: https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/upgradewatch/README.md#alerts
    - exp_labels:
        job: postfiat
        instance: node:9877
        container: postfiatd-sentry
        severity: warning
      exp_annotations:
        summary: 'postfiatd-sentry: an amendment this build does not support holds a majority'
        description: At least one amendment that postfiatd on this node does not support has held a majority of trusted validators
          for 10 min. If the majority holds for the network's [amendment_majority_time], it activates and this node becomes
          amendment blocked. Plan the upgrade; pft_upgradewatch_unsupported_activation_eta_seconds is the earliest activation
          time.
        runbook_url: https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/upgradewatch/README.md#alerts
  - eval_time: 41m
    alertname: PFTUnsupportedAmendmentMajority
    exp_alerts:
    - exp_labels:
        job: postfiat
        instance: node:9877
        container: postfiatd-sentry
        severity: warning
      exp_annotations:
        summary: 'postfiatd-sentry: an amendment this build does not support holds a majority'
        description: At least one amendment that postfiatd on this node does not support has held a majority of trusted validators
          for 10 min. If the majority holds for the network's [amendment_majority_time], it activates and this node becomes
          amendment blocked. Plan the upgrade; pft_upgradewatch_unsupported_activation_eta_seconds is the earliest activation
          time.
        runbook_url: https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/upgradewatch/README.md#alerts
  interval: 1m
- name: 'PFTUnsupportedAmendmentActivationSoon: ETA 90000 s; inside 24 h from 61m (90000-3660 < 86400), fires at 66m with
    86040 s left, value at 70m = 85800 s; resolves when the series drops to 0 at 81m; a far ETA and ETA 0 (none) never fire'
  input_series:
  - series: pft_upgradewatch_unsupported_activation_eta_seconds{job="postfiat", instance="node:9877", container="postfiatd"}
    values: 90000x80 0x20
  - series: pft_upgradewatch_unsupported_activation_eta_seconds{job="postfiat", instance="node:9877", container="drill-far"}
    values: 900000x100
  - series: pft_upgradewatch_unsupported_activation_eta_seconds{job="postfiat", instance="node:9877", container="drill-none"}
    values: '0x100'
  alert_rule_test:
  - eval_time: 60m
    alertname: PFTUnsupportedAmendmentActivationSoon
    exp_alerts: []
  - eval_time: 65m
    alertname: PFTUnsupportedAmendmentActivationSoon
    exp_alerts: []
  - eval_time: 66m
    alertname: PFTUnsupportedAmendmentActivationSoon
    exp_alerts:
    - exp_labels:
        job: postfiat
        instance: node:9877
        container: postfiatd
        severity: critical
      exp_annotations:
        summary: 'postfiatd: unsupported amendment can activate in 23h 54m 0s'
        description: An unsupported amendment's majority CloseTime + the majority time ends within 24 h (a negative time means
          it is past and activation waits only for the next flag ledger). After activation this node is amendment blocked.
          Upgrade before the ETA.
        runbook_url: https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/upgradewatch/README.md#alerts
  - eval_time: 70m
    alertname: PFTUnsupportedAmendmentActivationSoon
    exp_alerts:
    - exp_labels:
        job: postfiat
        instance: node:9877
        container: postfiatd
        severity: critical
      exp_annotations:
        summary: 'postfiatd: unsupported amendment can activate in 23h 50m 0s'
        description: An unsupported amendment's majority CloseTime + the majority time ends within 24 h (a negative time means
          it is past and activation waits only for the next flag ledger). After activation this node is amendment blocked.
          Upgrade before the ETA.
        runbook_url: https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/upgradewatch/README.md#alerts
  - eval_time: 81m
    alertname: PFTUnsupportedAmendmentActivationSoon
    exp_alerts: []
  - eval_time: 100m
    alertname: PFTUnsupportedAmendmentActivationSoon
    exp_alerts: []
  interval: 1m
- name: 'PFTUnsupportedAmendmentActivationSoon: an ETA already past still fires (negative time left)'
  input_series:
  - series: pft_upgradewatch_unsupported_activation_eta_seconds{job="postfiat", instance="node:9877", container="postfiatd"}
    values: 600x30
  alert_rule_test:
  - eval_time: 4m
    alertname: PFTUnsupportedAmendmentActivationSoon
    exp_alerts: []
  - eval_time: 15m
    alertname: PFTUnsupportedAmendmentActivationSoon
    exp_alerts:
    - exp_labels:
        job: postfiat
        instance: node:9877
        container: postfiatd
        severity: critical
      exp_annotations:
        summary: 'postfiatd: unsupported amendment can activate in -5m 0s'
        description: An unsupported amendment's majority CloseTime + the majority time ends within 24 h (a negative time means
          it is past and activation waits only for the next flag ledger). After activation this node is amendment blocked.
          Upgrade before the ETA.
        runbook_url: https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/upgradewatch/README.md#alerts
  interval: 1m
- name: 'PFTNodeVersionLag: behind the foundation fires at 25m (for 15m) and resolves at 41m; the peer path fires at exactly
    0.5 with 5 peers; 4 peers or a ratio just under 0.5 do not'
  input_series:
  - series: pft_upgradewatch_behind_foundation{job="postfiat", instance="node:9877", container="postfiatd"}
    values: 0x9 1x30 0x19
  - series: pft_upgradewatch_peers_newer_ratio{job="postfiat", instance="node:9877", container="postfiatd"}
    values: '0x60'
  - series: pft_upgradewatch_peers_versioned{job="postfiat", instance="node:9877", container="postfiatd"}
    values: 19x60
  - series: pft_upgradewatch_behind_foundation{job="postfiat", instance="node:9877", container="postfiatd-sentry"}
    values: '0x60'
  - series: pft_upgradewatch_peers_newer_ratio{job="postfiat", instance="node:9877", container="postfiatd-sentry"}
    values: 0.5x60
  - series: pft_upgradewatch_peers_versioned{job="postfiat", instance="node:9877", container="postfiatd-sentry"}
    values: 5x60
  - series: pft_upgradewatch_behind_foundation{job="postfiat", instance="node:9877", container="drill-few"}
    values: '0x60'
  - series: pft_upgradewatch_peers_newer_ratio{job="postfiat", instance="node:9877", container="drill-few"}
    values: 1x60
  - series: pft_upgradewatch_peers_versioned{job="postfiat", instance="node:9877", container="drill-few"}
    values: 4x60
  - series: pft_upgradewatch_behind_foundation{job="postfiat", instance="node:9877", container="drill-under"}
    values: '0x60'
  - series: pft_upgradewatch_peers_newer_ratio{job="postfiat", instance="node:9877", container="drill-under"}
    values: 0.4999x60
  - series: pft_upgradewatch_peers_versioned{job="postfiat", instance="node:9877", container="drill-under"}
    values: 19x60
  alert_rule_test:
  - eval_time: 14m
    alertname: PFTNodeVersionLag
    exp_alerts: []
  - eval_time: 15m
    alertname: PFTNodeVersionLag
    exp_alerts:
    - exp_labels:
        job: postfiat
        instance: node:9877
        container: postfiatd-sentry
        severity: warning
      exp_annotations:
        summary: postfiatd-sentry runs an older postfiatd build than the foundation or most of its peers
        description: For 15 min this node's build_version has been older than the foundation RPC's (pft_upgradewatch_behind_foundation
          1), or at least half of 5+ version-reporting peers run a newer build. New amendments usually ship with new builds,
          so lag comes before amendment-block risk. Compare pft_upgradewatch_build_info with pft_upgradewatch_foundation_build_info
          and plan the upgrade.
        runbook_url: https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/upgradewatch/README.md#alerts
  - eval_time: 24m
    alertname: PFTNodeVersionLag
    exp_alerts:
    - exp_labels:
        job: postfiat
        instance: node:9877
        container: postfiatd-sentry
        severity: warning
      exp_annotations:
        summary: postfiatd-sentry runs an older postfiatd build than the foundation or most of its peers
        description: For 15 min this node's build_version has been older than the foundation RPC's (pft_upgradewatch_behind_foundation
          1), or at least half of 5+ version-reporting peers run a newer build. New amendments usually ship with new builds,
          so lag comes before amendment-block risk. Compare pft_upgradewatch_build_info with pft_upgradewatch_foundation_build_info
          and plan the upgrade.
        runbook_url: https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/upgradewatch/README.md#alerts
  - eval_time: 25m
    alertname: PFTNodeVersionLag
    exp_alerts:
    - exp_labels:
        job: postfiat
        instance: node:9877
        container: postfiatd
        severity: warning
      exp_annotations:
        summary: postfiatd runs an older postfiatd build than the foundation or most of its peers
        description: For 15 min this node's build_version has been older than the foundation RPC's (pft_upgradewatch_behind_foundation
          1), or at least half of 5+ version-reporting peers run a newer build. New amendments usually ship with new builds,
          so lag comes before amendment-block risk. Compare pft_upgradewatch_build_info with pft_upgradewatch_foundation_build_info
          and plan the upgrade.
        runbook_url: https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/upgradewatch/README.md#alerts
    - exp_labels:
        job: postfiat
        instance: node:9877
        container: postfiatd-sentry
        severity: warning
      exp_annotations:
        summary: postfiatd-sentry runs an older postfiatd build than the foundation or most of its peers
        description: For 15 min this node's build_version has been older than the foundation RPC's (pft_upgradewatch_behind_foundation
          1), or at least half of 5+ version-reporting peers run a newer build. New amendments usually ship with new builds,
          so lag comes before amendment-block risk. Compare pft_upgradewatch_build_info with pft_upgradewatch_foundation_build_info
          and plan the upgrade.
        runbook_url: https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/upgradewatch/README.md#alerts
  - eval_time: 41m
    alertname: PFTNodeVersionLag
    exp_alerts:
    - exp_labels:
        job: postfiat
        instance: node:9877
        container: postfiatd-sentry
        severity: warning
      exp_annotations:
        summary: postfiatd-sentry runs an older postfiatd build than the foundation or most of its peers
        description: For 15 min this node's build_version has been older than the foundation RPC's (pft_upgradewatch_behind_foundation
          1), or at least half of 5+ version-reporting peers run a newer build. New amendments usually ship with new builds,
          so lag comes before amendment-block risk. Compare pft_upgradewatch_build_info with pft_upgradewatch_foundation_build_info
          and plan the upgrade.
        runbook_url: https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/upgradewatch/README.md#alerts
  interval: 1m
- name: 'PFTUpgradewatchStale: timestamp frozen at 600 -> older than 900 s from 26m, fires at 36m; up 0 for two runs fires
    at 20m; one failed run (5 min) does not; recovery resolves'
  input_series:
  - series: pft_upgradewatch_up{job="postfiat", instance="node:9877", container="postfiatd"}
    values: 1x60
  - series: pft_upgradewatch_collect_timestamp_seconds{job="postfiat", instance="node:9877", container="postfiatd"}
    values: 0+60x10 600x50
  - series: pft_upgradewatch_up{job="postfiat", instance="node:9877", container="postfiatd-sentry"}
    values: 1x9 0x15 1x35
  - series: pft_upgradewatch_collect_timestamp_seconds{job="postfiat", instance="node:9877", container="postfiatd-sentry"}
    values: 0+60x60
  - series: pft_upgradewatch_up{job="postfiat", instance="node:9877", container="drill-once"}
    values: 1x9 0x4 1x46
  - series: pft_upgradewatch_collect_timestamp_seconds{job="postfiat", instance="node:9877", container="drill-once"}
    values: 0+60x60
  alert_rule_test:
  - eval_time: 19m
    alertname: PFTUpgradewatchStale
    exp_alerts: []
  - eval_time: 20m
    alertname: PFTUpgradewatchStale
    exp_alerts:
    - exp_labels:
        job: postfiat
        instance: node:9877
        container: postfiatd-sentry
        severity: warning
      exp_annotations:
        summary: pft-upgradewatch for postfiatd-sentry is stale or failing
        description: 'Either the last collection is older than 15 min (pft-upgradewatch@postfiatd-sentry.timer, or for the
          sentry pft-upgradewatch-pull@postfiatd-sentry.timer on the validator, is not running) or two runs in a row failed
          (pft_upgradewatch_up 0: container stopped, RPC not answering, or a field missing or malformed). The amendment-block
          alerts for this node are blind. Run `sudo pft-upgradewatch collect --container postfiatd-sentry --stdout`.'
        runbook_url: https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/upgradewatch/README.md#alerts
  - eval_time: 35m
    alertname: PFTUpgradewatchStale
    exp_alerts: []
  - eval_time: 36m
    alertname: PFTUpgradewatchStale
    exp_alerts:
    - exp_labels:
        job: postfiat
        instance: node:9877
        container: postfiatd
        severity: warning
      exp_annotations:
        summary: pft-upgradewatch for postfiatd is stale or failing
        description: 'Either the last collection is older than 15 min (pft-upgradewatch@postfiatd.timer, or for the sentry
          pft-upgradewatch-pull@postfiatd.timer on the validator, is not running) or two runs in a row failed (pft_upgradewatch_up
          0: container stopped, RPC not answering, or a field missing or malformed). The amendment-block alerts for this node
          are blind. Run `sudo pft-upgradewatch collect --container postfiatd --stdout`.'
        runbook_url: https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/upgradewatch/README.md#alerts
  interval: 1m
