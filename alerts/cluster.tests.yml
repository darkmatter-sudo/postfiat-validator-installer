# promtool unit tests for cluster.rules.yml. Run: promtool test rules cluster.tests.yml
# Time 0 = 1970-01-01T00:00Z; 1m input intervals.
rule_files:
  - cluster.rules.yml
evaluation_interval: 1m
tests:
  - name: "findings fire after 15m with the count, per host; a host with 0 never fires"
    interval: 1m
    input_series:
      - series: 'pft_cluster_findings{host="validator"}'
        values: '2x30'
      - series: 'pft_cluster_findings{host="sentry"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 14m
        alertname: PFTClusterMissing
        exp_alerts: []
      - eval_time: 16m
        alertname: PFTClusterMissing
        exp_alerts:
          - exp_labels: {severity: warning, host: validator}
            exp_annotations:
              summary: "2 cluster check(s) FAIL/WARN on validator"
              description: "The pft-cluster audit says the validator<->sentry cluster is missing or degraded on this host (peer not connected as a cluster member, no cluster reports from it, node not on its pinned key, config/seed storage wrong, or the seed exposed). Run `sudo pft-cluster audit` to list the failing checks."
              runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/cluster/README.md#alert"
  - name: "both hosts degraded -> one alert per host, own counts"
    interval: 1m
    input_series:
      - series: 'pft_cluster_findings{host="validator"}'
        values: '7x30'
      - series: 'pft_cluster_findings{host="sentry"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: PFTClusterMissing
        exp_alerts:
          - exp_labels: {severity: warning, host: validator}
            exp_annotations:
              summary: "7 cluster check(s) FAIL/WARN on validator"
              description: "The pft-cluster audit says the validator<->sentry cluster is missing or degraded on this host (peer not connected as a cluster member, no cluster reports from it, node not on its pinned key, config/seed storage wrong, or the seed exposed). Run `sudo pft-cluster audit` to list the failing checks."
              runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/cluster/README.md#alert"
          - exp_labels: {severity: warning, host: sentry}
            exp_annotations:
              summary: "1 cluster check(s) FAIL/WARN on sentry"
              description: "The pft-cluster audit says the validator<->sentry cluster is missing or degraded on this host (peer not connected as a cluster member, no cluster reports from it, node not on its pinned key, config/seed storage wrong, or the seed exposed). Run `sudo pft-cluster audit` to list the failing checks."
              runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/cluster/README.md#alert"
  - name: "resolves once the next audit reports 0 (cluster re-formed)"
    interval: 1m
    input_series:
      - series: 'pft_cluster_findings{host="sentry"}'
        values: '2x20 0x10'
    alert_rule_test:
      - eval_time: 18m
        alertname: PFTClusterMissing
        exp_alerts:
          - exp_labels: {severity: warning, host: sentry}
            exp_annotations:
              summary: "2 cluster check(s) FAIL/WARN on sentry"
              description: "The pft-cluster audit says the validator<->sentry cluster is missing or degraded on this host (peer not connected as a cluster member, no cluster reports from it, node not on its pinned key, config/seed storage wrong, or the seed exposed). Run `sudo pft-cluster audit` to list the failing checks."
              runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/cluster/README.md#alert"
      - eval_time: 22m
        alertname: PFTClusterMissing
        exp_alerts: []
  - name: "a planned restart that re-forms the cluster within 15m does not page"
    interval: 1m
    input_series:
      - series: 'pft_cluster_findings{host="validator"}'
        values: '0x5 2x12 0x20'
    alert_rule_test:
      - eval_time: 17m
        alertname: PFTClusterMissing
        exp_alerts: []
      - eval_time: 30m
        alertname: PFTClusterMissing
        exp_alerts: []
  - name: "no series (audit never ran) is not this rule's job (pft-rulecheck / PFTTextfileStale)"
    interval: 1m
    input_series:
      - series: 'pft_cluster_last_run_timestamp_seconds{host="validator"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: PFTClusterMissing
        exp_alerts: []
