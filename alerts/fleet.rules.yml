# Alert rules for pft-fleet (../fleet). pft-fleet.timer runs `pft-fleet skew --metrics` on the validator every hour
# (it reads the sentry over ssh) and writes pft_fleet_*{host,addon} to the textfile dir; the pft exporter serves it.
# pft_fleet_drift_since_timestamp_seconds{host,addon} is the first run that saw that add-on not CURRENT on that host
# (host="*" for a cross-host DIVERGED add-on); the series disappears when a run sees it CURRENT again.
# Drift is normal for a few hours during a rollout (sentry first, then the validator); it is only worth a page when
# nobody finished the job: PFTFleetDriftStale fires after 24h.
# Tests: fleet.tests.yml (promtool test rules fleet.tests.yml).
groups:
  - name: pft-fleet
    rules:
      - alert: PFTFleetDriftStale
        expr: time() - pft_fleet_drift_since_timestamp_seconds > 86400
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "add-on {{ $labels.addon }} on {{ $labels.host }} has not matched the repo for over 24h"
          description: "pft-fleet has seen {{ $labels.addon }} as BEHIND, MODIFIED, MISSING or UNEXPECTED on {{ $labels.host }} (host=* means the hosts run different versions) for more than a day. Run `sudo pft-fleet skew` to see which file, then finish the rollout with `sudo pft-fleet sync --addon {{ $labels.addon }} --to <commit> --apply` inside a pft-maint window, or explain the hand edit and commit it."
          runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/fleet/README.md#alerts"
      - alert: PFTFleetCheckStale
        expr: time() - pft_fleet_last_run_timestamp_seconds > 3 * 3600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "pft-fleet skew has not run for 3 hours"
          description: "pft-fleet.timer runs hourly; without fresh runs, add-on drift is not detected and PFTFleetDriftStale cannot fire. Check `systemctl list-timers pft-fleet.timer` and `journalctl -u pft-fleet.service`."
          runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/fleet/README.md#alerts"
      - alert: PFTFleetHostUnreadable
        expr: pft_fleet_host_up == 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "pft-fleet cannot read the add-on files on {{ $labels.host }}"
          description: "The inventory over ssh failed for two hours (ssh key, sudo -n, or the host is down). Drift on that host is not being checked; its drift clocks are kept from the last good run."
          runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/fleet/README.md#alerts"
