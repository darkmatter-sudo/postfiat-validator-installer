# Prometheus config used by run-stack.sh (host network; every listener is 127.0.0.1).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/pft-alerts/postfiat.rules.yml
  - /etc/pft-alerts/divergence.rules.yml   # ../divergence (pft-divergence textfile metrics)
  - /etc/pft-alerts/logship.rules.yml      # ../logship (pft-logship textfile metrics)
  - /etc/pft-alerts/resources.rules.yml    # ../resources (pft-resources cgroup v2 textfile metrics)
  - /etc/pft-alerts/alertpath.rules.yml    # ../alertpath (always-firing pipeline watchdog, routed to the sink only)
  - /etc/pft-alerts/timesync.rules.yml     # ../timesync (pft-timesync chrony/NTS textfile metrics)
  - /etc/pft-alerts/statewatch.rules.yml   # ../statewatch (pft-statewatch server_info state/health counters)
  - /etc/pft-alerts/vulnscan.rules.yml     # ../vulnscan (pft-vulnscan USN OVAL audit + reboot owed)
  - /etc/pft-alerts/fleet.rules.yml        # ../fleet (pft-fleet add-on version skew)
  - /etc/pft-alerts/rulecheck.rules.yml    # ../rulecheck (dead alert rules + stale textfile inputs)
  - /etc/pft-alerts/sshcrypto.rules.yml    # ../sshcrypto (SSH algorithm/host key grades, probe mismatches, revert pending)
  - /etc/pft-alerts/authwatch.rules.yml    # ../authwatch (SSH/sudo auth: unknown-key logins, failed bursts, stale collector)
  - /etc/pft-alerts/feewatch.rules.yml     # ../feewatch (TxQ fill, open-ledger fee escalation, local vs network load, stale collector)
  - /etc/pft-alerts/privesc.rules.yml      # ../privesc (local privilege-escalation paths: SUID/caps, sudoers, exec chains, root-equivalent access)
  - /etc/pft-alerts/mounts.rules.yml       # ../mounts (host mount options: /tmp, /var/tmp, /dev/shm, data dir nodev/nosuid)
  - /etc/pft-alerts/upgradewatch.rules.yml # ../upgradewatch (amendment blocked, unsupported majority + activation ETA, version lag, stale collector)
  - /etc/pft-alerts/apparmor.rules.yml    # ../apparmor (kernel support, container profile + mode, boot persistence, recent DENIED events)
  - /etc/pft-alerts/cluster.rules.yml     # ../cluster (validator<->sentry cluster missing or degraded: any FAIL/WARN audit check)
  - /etc/pft-alerts/backfill.rules.yml    # ../backfill (interior ledger gap in the online_delete window; status unreadable / repair MISMATCH)
  - /etc/pft-alerts/keyescrow.rules.yml   # ../keyescrow (secrets not escrowed for 36 h / drift for 2 h, inventory failed, held copy failed verify)
  - /etc/pft-alerts/kernwatch.rules.yml   # ../kernwatch (host kernel log: OOM kill, hung task, lockup, I/O/fs error, conntrack full; warnings; stale collector)
  - /etc/pft-alerts/seccomp.rules.yml     # ../seccomp (container off the tailored seccomp profile / profile drift; EPERM denials in 24 h)
  - /etc/pft-alerts/jobwatch.rules.yml    # ../jobwatch (scheduled pft-*/postfiat* timers: failed, missed, disabled/removed; stale collector)
  - /etc/pft-alerts/schedaudit.rules.yml  # ../schedaudit (cron/anacron/at/timer entry points: new/removed vs accepted set, unallowlisted findings; stale collector)
  - /etc/pft-slo/*.rules.yml    # ../slo (availability SLO + burn-rate alerts); run-stack.sh mounts it
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]
scrape_configs:
  - job_name: postfiat
    static_configs:
      - targets: ["127.0.0.1:9877"]
