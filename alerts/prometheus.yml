# Prometheus config used by run-stack.sh (host network; every listener is 127.0.0.1).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/pft-alerts/postfiat.rules.yml
  - /etc/pft-alerts/divergence.rules.yml   # ../divergence (pft-divergence textfile metrics)
  - /etc/pft-alerts/logship.rules.yml      # ../logship (pft-logship textfile metrics)
  - /etc/pft-alerts/resources.rules.yml    # ../resources (pft-resources cgroup v2 textfile metrics)
  - /etc/pft-alerts/alertpath.rules.yml    # ../alertpath (always-firing pipeline watchdog, routed to the sink only)
  - /etc/pft-alerts/timesync.rules.yml     # ../timesync (pft-timesync chrony/NTS textfile metrics)
  - /etc/pft-alerts/statewatch.rules.yml   # ../statewatch (pft-statewatch server_info state/health counters)
  - /etc/pft-alerts/vulnscan.rules.yml     # ../vulnscan (pft-vulnscan USN OVAL audit + reboot owed)
  - /etc/pft-alerts/fleet.rules.yml        # ../fleet (pft-fleet add-on version skew)
  - /etc/pft-alerts/rulecheck.rules.yml    # ../rulecheck (dead alert rules + stale textfile inputs)
  - /etc/pft-alerts/sshcrypto.rules.yml    # ../sshcrypto (SSH algorithm/host key grades, probe mismatches, revert pending)
  - /etc/pft-slo/*.rules.yml    # ../slo (availability SLO + burn-rate alerts); run-stack.sh mounts it
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]
scrape_configs:
  - job_name: postfiat
    static_configs:
      - targets: ["127.0.0.1:9877"]
