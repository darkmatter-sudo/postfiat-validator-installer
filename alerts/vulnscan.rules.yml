# Alert rules for pft-vulnscan (../vulnscan). pft-vulnscan.timer scans once a day (04:20 UTC + up to 30 min) and writes
# pft_vulnscan_*{host="..."} to the textfile dir (validator: local; sentry: pulled by pft-vulnscan-pull.timer every
# 15 min); the pft exporter serves it. A failed scan writes up 0 and drops the affected_usns series, so the
# "persistent" rule restarts its 48h clock after a failure (PFTVulnScanFailing covers that gap).
# Tests: vulnscan.tests.yml (generated by ../vulnscan/tests/gen_rule_tests.py; promtool test rules vulnscan.tests.yml).
groups:
  - name: pft-vulnscan
    rules:
      - alert: PFTVulnScanFailing
        expr: pft_vulnscan_up == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "pft-vulnscan scan failed on {{ $labels.host }}"
          description: "The last USN OVAL scan exited 2 (stale or corrupt feed, oscap error, or a definition that could not be evaluated). Vulnerability status for this host is unknown until a scan succeeds. Run `sudo pft-vulnscan scan` and read the RESULT: ERROR line."
          runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/vulnscan/README.md#alerts"
      - alert: PFTVulnScanNotRunning
        expr: time() - pft_vulnscan_last_run_timestamp_seconds > 2 * 86400
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "pft-vulnscan has not run on {{ $labels.host }} for 2 days"
          description: "The daily scan missed two runs: pft-vulnscan.timer is stopped (or, for the sentry, pft-vulnscan-pull.timer on the validator cannot copy its textfile). Check `systemctl list-timers pft-vulnscan*`."
          runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/vulnscan/README.md#alerts"
      - alert: PFTVulnFeedStale
        # Canonical regenerates the feed several times a day; 3 days old means the fetch is failing. The scan itself
        # refuses a feed older than 7 days (MAX_FEED_AGE_DAYS), so this fires 4 days before that.
        expr: pft_vulnscan_feed_timestamp_seconds > 0 and time() - pft_vulnscan_feed_timestamp_seconds > 3 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "USN OVAL feed on {{ $labels.host }} is older than 3 days"
          description: "pft-vulnscan keeps scanning with its cached feed, so USNs published since are not checked; scans start failing at 7 days. Run `sudo pft-vulnscan fetch` to see the download error."
          runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/vulnscan/README.md#alerts"
      - alert: PFTVulnHighCriticalPersistent
        expr: sum by (instance, job, host) (pft_vulnscan_affected_usns{severity=~"critical|high"}) > 0
        for: 48h
        labels:
          severity: critical
        annotations:
          summary: "High/critical USNs still apply on {{ $labels.host }} after 48h"
          description: "At least one high or critical priority USN has applied to installed packages for 48h (two daily scans). Fix with `sudo pft-patch run --yes` in a maintenance window (../patch); USNs with fix=esm need Ubuntu Pro or removal of the package. List them with `sudo pft-vulnscan scan`."
          runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/vulnscan/README.md#alerts"
      - alert: PFTVulnRebootOwed
        expr: pft_vulnscan_reboot_owed == 1
        for: 72h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} has owed a reboot for 3 days"
          description: "A newer kernel is installed than the one running, or /var/run/reboot-required exists, so fixed kernel/library code is not live yet. Plan the reboot with pft-patch / pft-maint (../patch, ../maint)."
          runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/vulnscan/README.md#alerts"
