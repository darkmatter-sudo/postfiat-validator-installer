  - series: pft_internals_nodestore_reads_total{job="postfiat", instance="node:9877", container="postfiatd"}
    values: 0+480x60
  - series: pft_internals_nodestore_read_duration_seconds_total{job="postfiat", instance="node:9877", container="postfiatd"}
    values: 0+0.12x10 6+4.8x49
  - series: pft_internals_nodestore_reads_total{job="postfiat", instance="node:9877", container="postfiatd-sentry"}
    values: 0+12x60
  - series: pft_internals_nodestore_read_duration_seconds_total{job="postfiat", instance="node:9877", container="postfiatd-sentry"}
    values: 0+0.12x60
  alert_rule_test:
  - eval_time: 14m
    alertname: PFTInternalsNodeStoreSlow
    exp_alerts: []
  - eval_time: 29m
    alertname: PFTInternalsNodeStoreSlow
    exp_alerts: []
  - eval_time: 30m
    alertname: PFTInternalsNodeStoreSlow
    exp_alerts:
    - exp_labels:
        job: postfiat
        instance: node:9877
        container: postfiatd
        severity: warning
      exp_annotations:
        summary: postfiatd NodeStore reads are slow
        description: For 15m the mean NodeStore read on postfiatd took more than 5 ms (rate of node_reads_duration_us / rate of node_reads_total over 10m). Slow reads delay ledger acquisition and validation.
          Check disk latency (`iostat -x 5`), `sudo pft-resources audit` and `sudo pft-internals status --container postfiatd`.
        runbook_url: https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/internals/README.md#runbook
  - eval_time: 60m
