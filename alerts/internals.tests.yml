- name: 'CachedView hit ratio collapses to 0.2 at 30m: fires 30m after the 15m window crosses 0.4'
  interval: 1m
  input_series:
  - series: pft_internals_node_uptime_seconds{job="postfiat", instance="node:9877", container="postfiatd"}
    values: 7200+60x100
  - series: pft_internals_cached_view_total{job="postfiat", instance="node:9877", container="postfiatd", result="hit"}
    values: 0+96x30 2904+24x70
  - series: pft_internals_cached_view_total{job="postfiat", instance="node:9877", container="postfiatd", result="miss"}
    values: 0+24x30 816+96x70
  alert_rule_test:
  - eval_time: 39m
    alertname: PFTInternalsCacheCollapse
    exp_alerts: []
  - eval_time: 69m
    alertname: PFTInternalsCacheCollapse
    exp_alerts: []
  - eval_time: 70m
    alertname: PFTInternalsCacheCollapse
    exp_alerts:
    - exp_labels:
        job: postfiat
        instance: node:9877
        container: postfiatd
        severity: warning
      exp_annotations:
        summary: postfiatd ledger cache hit ratio collapsed
        description: 'For 30m fewer than 40% of postfiatd''s CachedView ledger-state lookups hit the cache (CachedView::hit / (hit + miss) over 15m, normally about 80%, node up for more than 30 min). Misses
          go to the NodeStore and disk: look for memory pressure (`sudo pft-resources audit`), a changed node_size/cache config, or a node fetching history.'
        runbook_url: https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/internals/README.md#runbook
  - eval_time: 100m
    alertname: PFTInternalsCacheCollapse
