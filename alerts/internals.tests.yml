    exp_alerts: []
  - eval_time: 11m
    alertname: PFTInternalsCounterAnomaly
    exp_alerts:
    - exp_labels:
        job: postfiat
        instance: node:9877
        container: postfiatd
        severity: warning
      exp_annotations:
        summary: postfiatd node counters went down without a restart
        description: 'In the last 30m pft-internals saw a cumulative node counter decrease on postfiatd while its uptime kept growing. That is not a restart: the counters are broken or a different node
          answers on the admin port. `sudo pft-internals status --container postfiatd` lists the counters.'
