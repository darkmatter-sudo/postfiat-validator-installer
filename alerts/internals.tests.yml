        runbook_url: https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/internals/README.md#runbook
  - eval_time: 32m
    alertname: PFTInternalsStale
    exp_alerts: []
- name: counter anomaly at 11m fires at once and clears when it leaves the 30m window; a collector state reset (3 -> 0) and node restarts do not fire
  interval: 1m
  input_series:
