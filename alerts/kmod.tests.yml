# promtool unit tests for kmod.rules.yml. Run: promtool test rules kmod.tests.yml (generated by hand from the
# pre-apply live shape: 13 loadable deny modules on both hosts; 1m input intervals).
rule_files:
  - kmod.rules.yml
evaluation_interval: 1m
tests:
  - name: "before apply: 13 loadable fires after 15m on both hosts; after apply (0 loadable) it resolves"
    interval: 1m
    input_series:
      - series: 'pft_kmod_deny_modules{host="validator",state="loadable"}'
        values: '13x19 0x20'
      - series: 'pft_kmod_deny_modules{host="validator",state="loaded"}'
        values: '0x19 0x20'
      - series: 'pft_kmod_deny_modules{host="validator",state="enforced"}'
        values: '7x19 20x20'
      - series: 'pft_kmod_required_blocked{host="validator"}'
        values: '0x19 0x20'
      - series: 'pft_kmod_autoload_ok{host="validator"}'
        values: '1x19 1x20'
      - series: 'pft_kmod_deny_modules{host="sentry",state="loadable"}'
        values: '13x40'
      - series: 'pft_kmod_deny_modules{host="sentry",state="loaded"}'
        values: '0x40'
      - series: 'pft_kmod_deny_modules{host="sentry",state="enforced"}'
        values: '7x40'
      - series: 'pft_kmod_required_blocked{host="sentry"}'
        values: '0x40'
      - series: 'pft_kmod_autoload_ok{host="sentry"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 14m
        alertname: PFTKmodFinding
        exp_alerts: []
      - eval_time: 16m
        alertname: PFTKmodFinding
        exp_alerts:
          - exp_labels: {severity: warning, host: sentry}
            exp_annotations:
              summary: "sentry: 13 kernel-module finding(s) (deny-list module loadable/loaded, required module blocked, or autoload bypass)"
              description: "The hourly pft-kmod audit found a deny-list module that is loaded or loadable without an install rule, a required module (Docker/netfilter/overlay) whose resolution hits an install rule, or kernel.modprobe not pointing at modprobe. Run `sudo pft-kmod audit` and read the FAIL lines; `sudo pft-kmod apply --yes` (in a pft-maint window) or `rollback --yes` fixes the common cases."
              runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/kmod/README.md#alerts"
          - exp_labels: {severity: warning, host: validator}
            exp_annotations:
              summary: "validator: 13 kernel-module finding(s) (deny-list module loadable/loaded, required module blocked, or autoload bypass)"
              description: "The hourly pft-kmod audit found a deny-list module that is loaded or loadable without an install rule, a required module (Docker/netfilter/overlay) whose resolution hits an install rule, or kernel.modprobe not pointing at modprobe. Run `sudo pft-kmod audit` and read the FAIL lines; `sudo pft-kmod apply --yes` (in a pft-maint window) or `rollback --yes` fixes the common cases."
              runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/kmod/README.md#alerts"
      - eval_time: 25m
        alertname: PFTKmodFinding
        exp_alerts:
          - exp_labels: {severity: warning, host: sentry}
            exp_annotations:
              summary: "sentry: 13 kernel-module finding(s) (deny-list module loadable/loaded, required module blocked, or autoload bypass)"
              description: "The hourly pft-kmod audit found a deny-list module that is loaded or loadable without an install rule, a required module (Docker/netfilter/overlay) whose resolution hits an install rule, or kernel.modprobe not pointing at modprobe. Run `sudo pft-kmod audit` and read the FAIL lines; `sudo pft-kmod apply --yes` (in a pft-maint window) or `rollback --yes` fixes the common cases."
              runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/kmod/README.md#alerts"
      - eval_time: 26m
        alertname: PFTKmodFinding
        exp_alerts:
          - exp_labels: {severity: warning, host: sentry}
            exp_annotations:
              summary: "sentry: 13 kernel-module finding(s) (deny-list module loadable/loaded, required module blocked, or autoload bypass)"
              description: "The hourly pft-kmod audit found a deny-list module that is loaded or loadable without an install rule, a required module (Docker/netfilter/overlay) whose resolution hits an install rule, or kernel.modprobe not pointing at modprobe. Run `sudo pft-kmod audit` and read the FAIL lines; `sudo pft-kmod apply --yes` (in a pft-maint window) or `rollback --yes` fixes the common cases."
              runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/kmod/README.md#alerts"
  - name: "a fully applied host never fires; required blocked and autoload bypass each count"
    interval: 1m
    input_series:
      - series: 'pft_kmod_deny_modules{host="validator",state="loadable"}'
        values: '0x40'
      - series: 'pft_kmod_deny_modules{host="validator",state="loaded"}'
        values: '0x40'
      - series: 'pft_kmod_deny_modules{host="validator",state="enforced"}'
        values: '20x40'
      - series: 'pft_kmod_required_blocked{host="validator"}'
        values: '0x40'
      - series: 'pft_kmod_autoload_ok{host="validator"}'
        values: '1x40'
      - series: 'pft_kmod_deny_modules{host="sentry",state="loadable"}'
        values: '0x40'
      - series: 'pft_kmod_deny_modules{host="sentry",state="loaded"}'
        values: '0x40'
      - series: 'pft_kmod_deny_modules{host="sentry",state="enforced"}'
        values: '20x40'
      - series: 'pft_kmod_required_blocked{host="sentry"}'
        values: '2x40'
      - series: 'pft_kmod_autoload_ok{host="sentry"}'
        values: '1x40'
      - series: 'pft_kmod_deny_modules{host="other",state="loadable"}'
        values: '0x40'
      - series: 'pft_kmod_deny_modules{host="other",state="loaded"}'
        values: '0x40'
      - series: 'pft_kmod_deny_modules{host="other",state="enforced"}'
        values: '20x40'
      - series: 'pft_kmod_required_blocked{host="other"}'
        values: '0x40'
      - series: 'pft_kmod_autoload_ok{host="other"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: PFTKmodFinding
        exp_alerts:
          - exp_labels: {severity: warning, host: other}
            exp_annotations:
              summary: "other: 1 kernel-module finding(s) (deny-list module loadable/loaded, required module blocked, or autoload bypass)"
              description: "The hourly pft-kmod audit found a deny-list module that is loaded or loadable without an install rule, a required module (Docker/netfilter/overlay) whose resolution hits an install rule, or kernel.modprobe not pointing at modprobe. Run `sudo pft-kmod audit` and read the FAIL lines; `sudo pft-kmod apply --yes` (in a pft-maint window) or `rollback --yes` fixes the common cases."
              runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/kmod/README.md#alerts"
          - exp_labels: {severity: warning, host: sentry}
            exp_annotations:
              summary: "sentry: 2 kernel-module finding(s) (deny-list module loadable/loaded, required module blocked, or autoload bypass)"
              description: "The hourly pft-kmod audit found a deny-list module that is loaded or loadable without an install rule, a required module (Docker/netfilter/overlay) whose resolution hits an install rule, or kernel.modprobe not pointing at modprobe. Run `sudo pft-kmod audit` and read the FAIL lines; `sudo pft-kmod apply --yes` (in a pft-maint window) or `rollback --yes` fixes the common cases."
              runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/kmod/README.md#alerts"
  - name: "a loaded deny module counts; a 10-minute blip never fires"
    interval: 1m
    input_series:
      - series: 'pft_kmod_deny_modules{host="validator",state="loadable"}'
        values: '0x40'
      - series: 'pft_kmod_deny_modules{host="validator",state="loaded"}'
        values: '1x40'
      - series: 'pft_kmod_deny_modules{host="validator",state="enforced"}'
        values: '19x40'
      - series: 'pft_kmod_required_blocked{host="validator"}'
        values: '0x40'
      - series: 'pft_kmod_autoload_ok{host="validator"}'
        values: '1x40'
      - series: 'pft_kmod_deny_modules{host="sentry",state="loadable"}'
        values: '0x10 0x29'
      - series: 'pft_kmod_deny_modules{host="sentry",state="loaded"}'
        values: '0x5 1x10 0x24'
      - series: 'pft_kmod_deny_modules{host="sentry",state="enforced"}'
        values: '19x10 20x29'
      - series: 'pft_kmod_required_blocked{host="sentry"}'
        values: '0x10 0x29'
      - series: 'pft_kmod_autoload_ok{host="sentry"}'
        values: '1x10 1x29'
    alert_rule_test:
      - eval_time: 30m
        alertname: PFTKmodFinding
        exp_alerts:
          - exp_labels: {severity: warning, host: validator}
            exp_annotations:
              summary: "validator: 1 kernel-module finding(s) (deny-list module loadable/loaded, required module blocked, or autoload bypass)"
              description: "The hourly pft-kmod audit found a deny-list module that is loaded or loadable without an install rule, a required module (Docker/netfilter/overlay) whose resolution hits an install rule, or kernel.modprobe not pointing at modprobe. Run `sudo pft-kmod audit` and read the FAIL lines; `sudo pft-kmod apply --yes` (in a pft-maint window) or `rollback --yes` fixes the common cases."
              runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/kmod/README.md#alerts"
  - name: "audit failing (up 0) fires after 10m, recovery clears it"
    interval: 1m
    input_series:
      - series: 'pft_kmod_up{host="sentry"}'
        values: '0x20 1x20'
      - series: 'pft_kmod_last_run_timestamp_seconds{host="sentry"}'
        values: '0+60x40'
      - series: 'pft_kmod_up{host="validator"}'
        values: '1x40'
      - series: 'pft_kmod_last_run_timestamp_seconds{host="validator"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 9m
        alertname: PFTKmodAuditStale
        exp_alerts: []
      - eval_time: 12m
        alertname: PFTKmodAuditStale
        exp_alerts:
          - exp_labels: {severity: warning, host: sentry}
            exp_annotations:
              summary: "pft-kmod audit on sentry failing or older than 3 h"
              description: "The last pft-kmod audit wrote up 0 (modprobe or /proc/modules unreadable) or no audit has been recorded for 3 hours (pft-kmod.timer stopped, or on the sentry the validator's pull cannot copy the file). Module hardening status is unknown. Check `systemctl list-timers pft-kmod.timer` and `journalctl -u pft-kmod.service`."
              runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/kmod/README.md#alerts"
      - eval_time: 25m
        alertname: PFTKmodAuditStale
        exp_alerts: []
  - name: "stale: last run older than 3h for 10m fires; an hourly run never fires; a fresh run recovers"
    interval: 1m
    input_series:
      - series: 'pft_kmod_up{host="validator"}'
        values: '1x260'
      - series: 'pft_kmod_last_run_timestamp_seconds{host="validator"}'
        values: '0x200 12000x60'
      - series: 'pft_kmod_up{host="sentry"}'
        values: '1x260'
      - series: 'pft_kmod_last_run_timestamp_seconds{host="sentry"}'
        values: '0x59 3600x59 7200x59 10800x59 14400x20'
    alert_rule_test:
      - eval_time: 185m
        alertname: PFTKmodAuditStale
        exp_alerts: []
      - eval_time: 192m
        alertname: PFTKmodAuditStale
        exp_alerts:
          - exp_labels: {severity: warning, host: validator}
            exp_annotations:
              summary: "pft-kmod audit on validator failing or older than 3 h"
              description: "The last pft-kmod audit wrote up 0 (modprobe or /proc/modules unreadable) or no audit has been recorded for 3 hours (pft-kmod.timer stopped, or on the sentry the validator's pull cannot copy the file). Module hardening status is unknown. Check `systemctl list-timers pft-kmod.timer` and `journalctl -u pft-kmod.service`."
              runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/kmod/README.md#alerts"
      - eval_time: 205m
        alertname: PFTKmodAuditStale
        exp_alerts: []
