# promtool unit tests for logship.rules.yml (1m sample interval = the check timer's period). Generated by hand.
# Run: promtool test rules logship.tests.yml
rule_files:
  - logship.rules.yml
evaluation_interval: 1m
tests:
  - name: healthy forwarding never fires (presence control for every branch below)
    interval: 1m
    input_series:
      - series: 'pft_logship_up{job="postfiat", instance="node:9877"}'
        values: "1x20"
      - series: 'pft_logship_lag_seconds{job="postfiat", instance="node:9877"}'
        values: "0 3 0 1 0x16"
      - series: 'pft_textfile_mtime_seconds{job="postfiat", instance="node:9877", file="pft_logship.prom"}'
        values: "0+60x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: PFTLogshipBroken
        exp_alerts: []
      - eval_time: 20m
        alertname: PFTLogshipBroken
        exp_alerts: []
  - name: failed check (up 0) fires after 5m
    interval: 1m
    input_series:
      - series: 'pft_logship_up{job="postfiat", instance="node:9877"}'
        values: "1 1 0x18"
      - series: 'pft_logship_lag_seconds{job="postfiat", instance="node:9877"}'
        values: "0x20"
      - series: 'pft_textfile_mtime_seconds{job="postfiat", instance="node:9877", file="pft_logship.prom"}'
        values: "0+60x20"
    alert_rule_test:
      - eval_time: 6m
        alertname: PFTLogshipBroken
        exp_alerts: []
      - eval_time: 7m
        alertname: PFTLogshipBroken
        exp_alerts:
          - exp_labels: {job: postfiat, instance: "node:9877", severity: warning}
            exp_annotations:
              summary: "Journal forwarding to the peer host is broken"
              description: "For 5m pft-logship has reported a failed check, an upload lag above 120 s, stale metrics (pft-logship-check.timer not running) or no metrics at all. Until it is fixed, a wipe of this host's journal is not covered by the peer copy. Run `sudo pft-logship check`."
              runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/logship/README.md#alert"
  - name: a 3-minute check failure (peer restart) stays quiet
    interval: 1m
    input_series:
      - series: 'pft_logship_up{job="postfiat", instance="node:9877"}'
        values: "1 0 0 0 1x16"
      - series: 'pft_logship_lag_seconds{job="postfiat", instance="node:9877"}'
        values: "0x20"
      - series: 'pft_textfile_mtime_seconds{job="postfiat", instance="node:9877", file="pft_logship.prom"}'
        values: "0+60x20"
    alert_rule_test:
      - eval_time: 4m
        alertname: PFTLogshipBroken
        exp_alerts: []
      - eval_time: 8m
        alertname: PFTLogshipBroken
        exp_alerts: []
  - name: upload lag above 120 s fires after 5m even while up reads 1
    interval: 1m
    input_series:
      - series: 'pft_logship_up{job="postfiat", instance="node:9877"}'
        values: "1x20"
      - series: 'pft_logship_lag_seconds{job="postfiat", instance="node:9877"}'
        values: "0 0 300x18"
      - series: 'pft_textfile_mtime_seconds{job="postfiat", instance="node:9877", file="pft_logship.prom"}'
        values: "0+60x20"
    alert_rule_test:
      - eval_time: 6m
        alertname: PFTLogshipBroken
        exp_alerts: []
      - eval_time: 7m
        alertname: PFTLogshipBroken
        exp_alerts:
          - exp_labels: {job: postfiat, instance: "node:9877", severity: warning}
            exp_annotations:
              summary: "Journal forwarding to the peer host is broken"
              description: "For 5m pft-logship has reported a failed check, an upload lag above 120 s, stale metrics (pft-logship-check.timer not running) or no metrics at all. Until it is fixed, a wipe of this host's journal is not covered by the peer copy. Run `sudo pft-logship check`."
              runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/logship/README.md#alert"
  - name: lag exactly 120 s (= MAX_LAG) is fine
    interval: 1m
    input_series:
      - series: 'pft_logship_up{job="postfiat", instance="node:9877"}'
        values: "1x20"
      - series: 'pft_logship_lag_seconds{job="postfiat", instance="node:9877"}'
        values: "120x20"
      - series: 'pft_textfile_mtime_seconds{job="postfiat", instance="node:9877", file="pft_logship.prom"}'
        values: "0+60x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: PFTLogshipBroken
        exp_alerts: []
  - name: metrics stale (check timer stopped at 2m) fires once older than 300 s for 5m
    interval: 1m
    input_series:
      - series: 'pft_logship_up{job="postfiat", instance="node:9877"}'
        values: "1x20"
      - series: 'pft_logship_lag_seconds{job="postfiat", instance="node:9877"}'
        values: "0x20"
      - series: 'pft_textfile_mtime_seconds{job="postfiat", instance="node:9877", file="pft_logship.prom"}'
        values: "0 60 120x18"
    alert_rule_test:
      - eval_time: 7m
        alertname: PFTLogshipBroken
        exp_alerts: []
      - eval_time: 12m
        alertname: PFTLogshipBroken
        exp_alerts: []
      - eval_time: 13m
        alertname: PFTLogshipBroken
        exp_alerts:
          - exp_labels: {job: postfiat, instance: "node:9877", severity: warning, file: pft_logship.prom}
            exp_annotations:
              summary: "Journal forwarding to the peer host is broken"
              description: "For 5m pft-logship has reported a failed check, an upload lag above 120 s, stale metrics (pft-logship-check.timer not running) or no metrics at all. Until it is fixed, a wipe of this host's journal is not covered by the peer copy. Run `sudo pft-logship check`."
              runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/logship/README.md#alert"
  - name: metrics missing (textfile deleted) fires after 5m
    interval: 1m
    input_series:
      - series: 'pft_textfile_mtime_seconds{job="postfiat", instance="node:9877", file="pft_divergence.prom"}'
        values: "0+60x20"
    alert_rule_test:
      - eval_time: 4m
        alertname: PFTLogshipBroken
        exp_alerts: []
      - eval_time: 5m
        alertname: PFTLogshipBroken
        exp_alerts:
          - exp_labels: {job: postfiat, severity: warning}
            exp_annotations:
              summary: "Journal forwarding to the peer host is broken"
              description: "For 5m pft-logship has reported a failed check, an upload lag above 120 s, stale metrics (pft-logship-check.timer not running) or no metrics at all. Until it is fixed, a wipe of this host's journal is not covered by the peer copy. Run `sudo pft-logship check`."
              runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/logship/README.md#alert"
