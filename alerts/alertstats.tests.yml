# promtool unit tests for alertstats.rules.yml. Run: promtool test rules alertstats.tests.yml
# NxM in values = N, then M more samples (1x20 covers t 0..20). Each reason has a fire case at its `for` boundary
# (one minute before = not yet), a recovery case (last bad sample = still firing, next = clear), and cases that must stay quiet.
rule_files:
- alertstats.rules.yml
evaluation_interval: 1m
tests:
- name: healthy report, nothing flapping, for 3h fires nothing
  interval: 1m
  input_series:
  - series: pft_alertstats_up{host="validator"}
    values: 1x180
  - series: pft_alertstats_flapping{host="validator",alertname="PFTJobFailed"}
    values: 0x180
  - series: pft_alertstats_flapping{host="validator",alertname="PFTClusterMissing"}
    values: 0x180
  alert_rule_test:
  - eval_time: 10m
    alertname: PFTAlertFlapping
    exp_alerts: []
  - eval_time: 179m
    alertname: PFTAlertFlapping
    exp_alerts: []
- name: PFTJobFailed flapping from 10m fires at 15m (for 5m) with the alert relabelled, the other stays quiet, clears at 41m
  interval: 1m
  input_series:
  - series: pft_alertstats_up{host="validator"}
    values: 1x60
  - series: pft_alertstats_flapping{host="validator",alertname="PFTJobFailed"}
    values: 0x9 1x30 0x20
  - series: pft_alertstats_flapping{host="validator",alertname="PFTClusterMissing"}
    values: 0x60
  alert_rule_test:
  - eval_time: 14m
    alertname: PFTAlertFlapping
    exp_alerts: []
  - eval_time: 15m
    alertname: PFTAlertFlapping
    exp_alerts:
    - exp_labels:
        severity: warning
        host: validator
        flapping_alert: PFTJobFailed
        reason: flapping
      exp_annotations:
        summary: "validator: alert PFTJobFailed is flapping (>= 3 unsilenced firings within 1h in the last 24h)"
        description: "pft-alertstats rebuilds alert episodes from Prometheus ALERTS history once a day. A flapping alert fires, resolves and fires again for one underlying problem; read `sudo pft-alertstats report --offline /var/lib/pft-alertstats/bundles/<latest>.json.gz` (per-alert flaps, TTR, max near-miss) and widen its for: or fix the expression. report-error: run `sudo pft-alertstats run` and read the error (Prometheus unreachable or query_range refused)."
        runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/alertstats/README.md#alert"
  - eval_time: 40m
    alertname: PFTAlertFlapping
    exp_alerts:
    - exp_labels:
        severity: warning
        host: validator
        flapping_alert: PFTJobFailed
        reason: flapping
      exp_annotations:
        summary: "validator: alert PFTJobFailed is flapping (>= 3 unsilenced firings within 1h in the last 24h)"
        description: "pft-alertstats rebuilds alert episodes from Prometheus ALERTS history once a day. A flapping alert fires, resolves and fires again for one underlying problem; read `sudo pft-alertstats report --offline /var/lib/pft-alertstats/bundles/<latest>.json.gz` (per-alert flaps, TTR, max near-miss) and widen its for: or fix the expression. report-error: run `sudo pft-alertstats run` and read the error (Prometheus unreachable or query_range refused)."
        runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/alertstats/README.md#alert"
  - eval_time: 41m
    alertname: PFTAlertFlapping
    exp_alerts: []
  - eval_time: 59m
    alertname: PFTAlertFlapping
    exp_alerts: []
- name: two alertnames flapping at once give two alerts
  interval: 1m
  input_series:
  - series: pft_alertstats_up{host="validator"}
    values: 1x20
  - series: pft_alertstats_flapping{host="validator",alertname="PFTJobFailed"}
    values: 1x20
  - series: pft_alertstats_flapping{host="validator",alertname="PFTPeerFixedLinkDown"}
    values: 1x20
  alert_rule_test:
  - eval_time: 5m
    alertname: PFTAlertFlapping
    exp_alerts:
    - exp_labels: {severity: warning, host: validator, flapping_alert: PFTJobFailed, reason: flapping}
      exp_annotations:
        summary: "validator: alert PFTJobFailed is flapping (>= 3 unsilenced firings within 1h in the last 24h)"
        description: "pft-alertstats rebuilds alert episodes from Prometheus ALERTS history once a day. A flapping alert fires, resolves and fires again for one underlying problem; read `sudo pft-alertstats report --offline /var/lib/pft-alertstats/bundles/<latest>.json.gz` (per-alert flaps, TTR, max near-miss) and widen its for: or fix the expression. report-error: run `sudo pft-alertstats run` and read the error (Prometheus unreachable or query_range refused)."
        runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/alertstats/README.md#alert"
    - exp_labels: {severity: warning, host: validator, flapping_alert: PFTPeerFixedLinkDown, reason: flapping}
      exp_annotations:
        summary: "validator: alert PFTPeerFixedLinkDown is flapping (>= 3 unsilenced firings within 1h in the last 24h)"
        description: "pft-alertstats rebuilds alert episodes from Prometheus ALERTS history once a day. A flapping alert fires, resolves and fires again for one underlying problem; read `sudo pft-alertstats report --offline /var/lib/pft-alertstats/bundles/<latest>.json.gz` (per-alert flaps, TTR, max near-miss) and widen its for: or fix the expression. report-error: run `sudo pft-alertstats run` and read the error (Prometheus unreachable or query_range refused)."
        runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/alertstats/README.md#alert"
- name: report-error (up 0) from 10m fires at 15m with flapping_alert "-", clears when up returns at 31m
  interval: 1m
  input_series:
  - series: pft_alertstats_up{host="validator"}
    values: 1x9 0x20 1x30
  alert_rule_test:
  - eval_time: 14m
    alertname: PFTAlertFlapping
    exp_alerts: []
  - eval_time: 15m
    alertname: PFTAlertFlapping
    exp_alerts:
    - exp_labels: {severity: warning, host: validator, flapping_alert: "-", reason: report-error}
      exp_annotations:
        summary: "validator: alert-behaviour report could not read Prometheus"
        description: "pft-alertstats rebuilds alert episodes from Prometheus ALERTS history once a day. A flapping alert fires, resolves and fires again for one underlying problem; read `sudo pft-alertstats report --offline /var/lib/pft-alertstats/bundles/<latest>.json.gz` (per-alert flaps, TTR, max near-miss) and widen its for: or fix the expression. report-error: run `sudo pft-alertstats run` and read the error (Prometheus unreachable or query_range refused)."
        runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/alertstats/README.md#alert"
  - eval_time: 30m
    alertname: PFTAlertFlapping
    exp_alerts:
    - exp_labels: {severity: warning, host: validator, flapping_alert: "-", reason: report-error}
      exp_annotations:
        summary: "validator: alert-behaviour report could not read Prometheus"
        description: "pft-alertstats rebuilds alert episodes from Prometheus ALERTS history once a day. A flapping alert fires, resolves and fires again for one underlying problem; read `sudo pft-alertstats report --offline /var/lib/pft-alertstats/bundles/<latest>.json.gz` (per-alert flaps, TTR, max near-miss) and widen its for: or fix the expression. report-error: run `sudo pft-alertstats run` and read the error (Prometheus unreachable or query_range refused)."
        runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/alertstats/README.md#alert"
  - eval_time: 31m
    alertname: PFTAlertFlapping
    exp_alerts: []
- name: a flap that lasts only 4 minutes (one bad textfile) never fires
  interval: 1m
  input_series:
  - series: pft_alertstats_up{host="validator"}
    values: 1x30
  - series: pft_alertstats_flapping{host="validator",alertname="PFTJobFailed"}
    values: 0x9 1x3 0x17
  alert_rule_test:
  - eval_time: 13m
    alertname: PFTAlertFlapping
    exp_alerts: []
  - eval_time: 20m
    alertname: PFTAlertFlapping
    exp_alerts: []
