# Alert rule for pft-alertstats (../alertstats). The validator's pft-alertstats.timer (daily, 05:23 UTC) runs
# `pft-alertstats run`, which rebuilds the last 7 days of alert episodes from Prometheus ALERTS history and writes
# pft_alertstats.prom: pft_alertstats_up, pft_alertstats_last_run_timestamp_seconds, pft_alertstats_flapping{alertname}
# (0/1 for every alertname with an episode in the window), flaps, episodes, TTR p95, silenced seconds and
# pft_alertstats_hygiene_findings{check,severity}.
# Exactly one alert, two reasons:
#   flapping      an alertname had >= FLAP_MIN (3) unsilenced fired episodes of one series starting within
#                 FLAP_WINDOW (1h) of each other in the last 24h: it pages repeatedly for one problem; tune its
#                 for:/expr or fix the cause. The flapping alert is in the flapping_alert label (an `alertname`
#                 label in a rule result is overwritten by the rule's own name, so it is relabelled).
#   report-error  the last run could not capture Prometheus (pft_alertstats_up 0).
# A stopped timer leaves the textfile old: pft-rulecheck grades it (textfile pft_alertstats.prom 30h ->
# PFTTextfileStale), so staleness is not a second alertstats alert. Hygiene findings do not page (see the report).
# Tests: alertstats.tests.yml (promtool test rules alertstats.tests.yml), 1m sample interval.
groups:
  - name: pft-alertstats
    rules:
      - alert: PFTAlertFlapping
        expr: |
          label_replace(
            max by (host, flapping_alert) (
              label_replace(pft_alertstats_flapping, "flapping_alert", "$1", "alertname", "(.+)")
            ) == 1,
            "reason", "flapping", "", "")
          or
          label_replace(label_replace(max by (host) (pft_alertstats_up) == 0, "reason", "report-error", "", ""),
            "flapping_alert", "-", "", "")
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }}: {{ if eq $labels.reason \"report-error\" }}alert-behaviour report could not read Prometheus{{ else }}alert {{ $labels.flapping_alert }} is flapping (>= 3 unsilenced firings within 1h in the last 24h){{ end }}"
          description: "pft-alertstats rebuilds alert episodes from Prometheus ALERTS history once a day. A flapping alert fires, resolves and fires again for one underlying problem; read `sudo pft-alertstats report --offline /var/lib/pft-alertstats/bundles/<latest>.json.gz` (per-alert flaps, TTR, max near-miss) and widen its for: or fix the expression. report-error: run `sudo pft-alertstats run` and read the error (Prometheus unreachable or query_range refused)."
          runbook_url: "https://github.com/darkmatter-sudo/postfiat-validator-installer/blob/main/alertstats/README.md#alert"
