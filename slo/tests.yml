    values: 1x239
  - series: pft_up{instance="node:9877", job="postfiat"}
    values: 1x239
  - series: pft_server_state{instance="node:9877", job="postfiat", state="full"}
    values: 4x239
  - series: pft_validated_ledger_age_seconds{instance="node:9877", job="postfiat"}
    values: 3x239
  - series: pft_maint_active{instance="node:9877", job="postfiat"}
    values: '0x239'
  alert_rule_test:
  - eval_time: 2h
    alertname: PFTSLOFastBurn
    exp_alerts: []
  - eval_time: 2h
    alertname: PFTSLOSlowBurn
    exp_alerts: []
  - eval_time: 3h55m
    alertname: PFTSLOFastBurn
    exp_alerts: []
  - eval_time: 3h55m
    alertname: PFTSLOSlowBurn
    exp_alerts: []
  promql_expr_test:
  - expr: pft:sli_good:bool
    eval_time: 3h
    exp_samples:
    - labels: pft:sli_good:bool{instance="node:9877", job="postfiat"}
      value: 1
  - expr: pft:sli_error:ratio_rate1h
    eval_time: 3h
    exp_samples:
    - labels: pft:sli_error:ratio_rate1h{instance="node:9877", job="postfiat"}
      value: 0
  - expr: pft:slo_budget_remaining:ratio
    eval_time: 3h
    exp_samples:
    - labels: pft:slo_budget_remaining:ratio{instance="node:9877", job="postfiat"}
      value: 1
  - expr: pft:slo_objective:ratio
    eval_time: 1m
    exp_samples:
    - labels: pft:slo_objective:ratio
      value: 0.995
