# Installed by backupwatch/install.sh --role archive (validator).
# Replicate the archive pft-backup just wrote straight away. Waiting for the 04:05 replicate timer left the newest
# archive without an off-host copy for 35-58 min every night, longer than PFTBackupNoOffhostCopy's 30 min `for`.
[Unit]
OnSuccess=pft-backupwatch-replicate.service
