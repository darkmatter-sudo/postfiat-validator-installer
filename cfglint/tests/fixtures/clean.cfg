# clean config: every section/key is read by postfiatd 32723c15
[server]
port_rpc_admin_local
port_peer

[port_rpc_admin_local]
port = 5005
ip = 127.0.0.1
admin = 127.0.0.1
protocol = http

[port_peer]
port = 2559
ip = 0.0.0.0
protocol = peer

[node_size]
small

[node_db]
type=NuDB
path=/var/lib/postfiatd/db/nudb
online_delete=512
advisory_delete=0

[crawl]
0

[vl]
enabled=0

[overlay]
ip_limit = 2  # trailing comment is stripped

[validator_token]
eyJhYmMiOiJkZWYifQ==
c2VlZD10ZXN0

[validators_file]
validators.txt
